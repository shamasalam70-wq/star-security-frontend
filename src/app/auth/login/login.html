<div class="login-container">
  <div class="login-card">
    <h2>Employee Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()">

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" formControlName="email">

        <div *ngIf="submitted && f['email'].invalid" class="error">
          <small *ngIf="f['email'].hasError('required')">Email is required</small>
          <small *ngIf="f['email'].hasError('email')">Email must be a valid email address</small>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" formControlName="password">

        <div *ngIf="submitted && f['password'].invalid" class="error">
          <small *ngIf="f['password'].hasError('required')">Password is required</small>
          <small *ngIf="f['password'].hasError('minlength')">Password must be at least 6 characters</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error alert-error">
        {{ errorMessage }}
      </div>

      <button class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="note">
      This login is only for employees.
      <a routerLink="/job-apply" class="apply-link">
        Apply for vacancies
      </a>
    </p>
  </div>
</div>
