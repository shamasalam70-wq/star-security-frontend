

<div class="form-container">
  <div class="form-card">
    <h2>Apply for {{ selectedRole }}</h2>

    <form (ngSubmit)="submitForm()">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="formData.name" name="name"
               (input)="onlyLetters($event)">
        <small *ngIf="submitted && !formData.name" class="error">
          Name is required
        </small>
      </div>

      <div class="form-group">
        <label>CNIC (13 digits)</label>
        <input type="text" maxlength="13"
               [(ngModel)]="formData.cnic" name="cnic"
               (input)="onlyNumbers($event, 'cnic')">
        <small *ngIf="submitted && formData.cnic.length !== 13" class="error">
          CNIC must be 13 digits
        </small>
      </div>

      <div class="form-group">
        <label>Age</label>
        <input type="text"
               [(ngModel)]="formData.age" name="age"
               (input)="onlyNumbers($event, 'age')">
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text"
               [(ngModel)]="formData.phone" name="phone"
               (input)="onlyNumbers($event, 'phone')">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email"
               [(ngModel)]="formData.email" name="email">
      </div>

      <div class="form-group">
        <label>Upload CV</label>
        <input type="file" (change)="onFileChange($event)">
        <small *ngIf="submitted && !formData.cv" class="error">
          CV is required
        </small>
      </div>

      <button class="btn btn-primary">Submit Application</button>
    </form>
  </div>
</div>
