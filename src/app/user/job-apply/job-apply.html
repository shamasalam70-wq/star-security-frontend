<div class="container pt-5 pb-5">
  <div class="text-center mb-5">
    <h2>Current Vacancies</h2>
    <p>Select a position to apply</p>
  </div>

  <div class="row" *ngIf="vacancies.length > 0; else noVacancies">
    <div class="col-md-6 mb-4" *ngFor="let vacancy of vacancies">
      <div class="card vacancy-card"
           routerLink="/job-apply-form"
           [queryParams]="{role: vacancy.title, vacancyId: vacancy.id}">
        <div class="card-body">
          <h5>{{ vacancy.title }}</h5>
          <p>{{ vacancy.description }}</p>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noVacancies>
    <div class="text-center">
      <p>No vacancies available at the moment. Please check back later.</p>
    </div>
  </ng-template>
</div>
