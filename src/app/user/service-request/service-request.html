<div class="page-wrapper mt-5">
  <div class="form-card">
    <h2>Service Request</h2>

    <form [formGroup]="requestForm" (ngSubmit)="submitForm()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" formControlName="name">
        <div *ngIf="submitted && f['name'].invalid" class="error">
          <small *ngIf="f['name'].hasError('required')">Name is required</small>
          <small *ngIf="f['name'].hasError('pattern')">Only letters and spaces are allowed</small>
        </div>
      </div>

      <div class="form-group">
        <label>Phone Number (11 digits)</label>
        <input type="text" class="form-control" formControlName="phone" maxlength="11">
        <div *ngIf="submitted && f['phone'].invalid" class="error">
          <small *ngIf="f['phone'].hasError('required')">Phone is required</small>
          <small *ngIf="f['phone'].hasError('pattern')">Only numbers are allowed (11 digits)</small>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" formControlName="email">
        <div *ngIf="submitted && f['email'].invalid" class="error">
          <small *ngIf="f['email'].hasError('required')">Email is required</small>
          <small *ngIf="f['email'].hasError('email')">Email must be a valid email address</small>
        </div>
      </div>

      <div class="form-group">
        <label>Select Service</label>
        <select class="form-control" formControlName="service">
          <option value="">-- Select --</option>
          <option *ngFor="let s of services" [value]="s.Name || s.name">{{ s.Name || s.name }}</option>
        </select>
        <div *ngIf="submitted && f['service'].invalid" class="error">
          <small *ngIf="f['service'].hasError('required')">Please select a service</small>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error alert-error">
        {{ errorMessage }}
      </div>

      <button class="btn btn-primary btn-submit">
        Submit Request
      </button>
    </form>
  </div>
</div>
