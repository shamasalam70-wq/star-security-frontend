<app-navbar></app-navbar>

<div class="page-wrapper">
  <div class="form-card">
    <h2>Service Request</h2>

    <form (ngSubmit)="submitForm()">
      <div class="form-group">
  <label>Full Name</label>
  <input type="text" class="form-control"
         [(ngModel)]="formData.name"
         name="name"
         (input)="onlyLetters($event)">
         
  <small class="error" *ngIf="submitted && !formData.name">
    Name is required (letters only)
  </small>
</div>


      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" class="form-control"
               [(ngModel)]="formData.phone"
               name="phone"
               (input)="onlyNumbers($event)"
               maxlength="11">
        <small class="error" *ngIf="submitted && !formData.phone">
          Phone number is required
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control"
               [(ngModel)]="formData.email"
               name="email">
        <small class="error" *ngIf="submitted && !formData.email">
          Email is required
        </small>
      </div>

      <div class="form-group">
        <label>Select Service</label>
        <select class="form-control"
                [(ngModel)]="formData.service"
                name="service">
          <option value="">-- Select --</option>
          <option>Office Security</option>
          <option>Home Security</option>
          <option>Private Guards</option>
          <option>Event Security</option>
        </select>
        <small class="error" *ngIf="submitted && !formData.service">
          Please select a service
        </small>
      </div>

      <button class="btn btn-primary btn-submit">
        Submit Request
      </button>
    </form>
  </div>
</div>
